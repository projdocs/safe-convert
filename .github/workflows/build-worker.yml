name: Build Worker Image

on:
  push:
    branches:
      - main
    paths:
      - worker.Dockerfile
      - worker.go
  pull_request:
    paths:
      - worker.Dockerfile
      - worker.go
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/safe-convert-worker

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # QEMU enables cross-compilation for arm64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Buildx is required for multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only push on main branch or manual dispatch — not on PRs, which
        # may originate from forks and must not have write access to the registry.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags and labels from git metadata.
      #
      # On main:       ghcr.io/org/safe-convert-worker:latest
      #                ghcr.io/org/safe-convert-worker:sha-<short>
      # On PR:         ghcr.io/org/safe-convert-worker:pr-<number>  (not pushed)
      # On tag v*.*.*: ghcr.io/org/safe-convert-worker:1.2.3
      #                ghcr.io/org/safe-convert-worker:latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=safe-convert-worker
            org.opencontainers.image.description=Hardened LibreOffice worker for safe-convert
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only on main or manual dispatch; PRs are built but not pushed.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inline cache keeps build times short without an external cache backend.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Treat all build warnings as errors — a warning in a Dockerfile for a
          # security-critical image must be resolved, not silently ignored.
          build-args: |
            BUILDKIT_DOCKERFILE_LINTING=true

      # Output the image digest so it can be pinned in config.
      # The digest is the value that must go into SAFE_CONVERT_WORKER_IMAGE.
      - name: Output digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Worker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest (pin this in SAFE_CONVERT_WORKER_IMAGE):**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY